<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RakshaCast | Citizen Disaster Safety App</title>
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a192f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="RakshaCast">
    <meta name="mobile-web-app-capable" content="yes">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        resq: {
                            navy: "#0a192f",
                            dark: "#070d1e",
                            card: "#111c33",
                            cardHover: "#182746",
                            border: "#203354",
                            critical: "#dc2626",
                            warning: "#ea580c",
                            watch: "#eab308",
                            safe: "#16a34a",
                            cyan: "#06b6d4",
                            saffron: "#f97316"
                        }
                    },
                    fontFamily: {
                        sans: ["Inter", "-apple-system", "BlinkMacSystemFont", "Segoe UI", "Roboto", "sans-serif"],
                        mono: ["JetBrains Mono", "monospace"]
                    }
                }
            }
        };
    </script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
    
    <!-- Leaflet GIS CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            box-sizing: border-box;
        }
        html, body {
            height: 100%;
            height: 100dvh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #0a192f;
            color: #0f172a;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        .custom-scrollbar::-webkit-scrollbar { width: 4px; height: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }

        /* Fullscreen Mobile Viewport Container */
        #mobile-app-root {
            display: flex;
            flex-direction: column;
            height: 100%;
            height: 100dvh;
            width: 100%;
            max-width: 540px;
            margin: 0 auto;
            background-color: #ffffff;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
            position: relative;
        }
    </style>
</head>
<body class="bg-[#070d1e] flex items-center justify-center">

    <!-- ROOT CONTAINER FOR DEDICATED PHONE INTERFACE -->
    <div id="mobile-app-root">

        <!-- Phone Top Native Header -->
        <header class="bg-gradient-to-r from-blue-950 via-slate-900 to-indigo-950 text-white px-4 py-2.5 flex items-center justify-between text-xs shrink-0 shadow-md border-b border-[#203354] pt-safe">
            <div class="flex items-center space-x-2.5">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center font-black text-white text-base shadow">
                    🛡️
                </div>
                <div>
                    <div class="flex items-center space-x-1.5">
                        <span class="font-black text-sm tracking-tight text-amber-400">RakshaCast</span>
                        <span class="text-[9px] bg-emerald-500/20 text-emerald-300 font-extrabold px-1.5 py-0.2 rounded border border-emerald-500/40">LIVE</span>
                    </div>
                    <p class="text-[10px] text-slate-300 font-medium">NDRF & MoES Connected</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Location & GPS Tracker Badge -->
                <button onclick="fetchLiveOpenMeteo(STATE.userCoords[0], STATE.userCoords[1])" class="flex items-center space-x-1 text-[10px] bg-blue-900/80 text-blue-200 border border-blue-700/60 px-2 py-1 rounded-lg font-semibold active:scale-95 transition">
                    <i data-lucide="map-pin" class="w-3 h-3 text-cyan-400"></i>
                    <span id="loc-display-top" class="max-w-[90px] truncate">GPS Live</span>
                </button>
                <button id="role-toggle-btn" onclick="toggleAuthorityMode()" class="px-2 py-1 rounded-lg text-[10px] font-bold bg-amber-500/20 text-amber-300 border border-amber-500/40 transition">
                    👤 Citizen
                </button>
            </div>
        </header>

        <!-- Live Real-Time NDRF Dispatch Alert Banner (Appears when NDRF dispatches help) -->
        <div id="citizen-dispatch-status-banner" class="hidden mx-3 mt-2 bg-gradient-to-r from-emerald-950 via-teal-950 to-slate-950 border-2 border-emerald-400 rounded-2xl p-3 text-white space-y-1.5 shadow-2xl shrink-0 animate-bounce">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping"></span>
                    <span class="text-xs font-black text-emerald-400 uppercase tracking-wider">NDRF Rescue Battalion Dispatched!</span>
                </div>
                <span id="citizen-dispatch-eta" class="text-[10px] bg-emerald-900 text-emerald-200 px-2 py-0.5 rounded font-mono font-extrabold">ETA: 8 MINS</span>
            </div>
            <p class="text-[11px] text-slate-200 leading-snug" id="citizen-dispatch-msg">
                10th NDRF Battalion boat unit is actively en route to your GPS coordinates. Stay in safe high elevation.
            </p>
        </div>

        <!-- MAIN SCROLLABLE VIEWPORT (Renders all 7 RakshaCast Citizen Tabs) -->
        <main id="screen-viewport" class="flex-1 overflow-y-auto custom-scrollbar p-3.5 space-y-3.5 bg-slate-100 text-slate-900 pb-20"></main>

        <!-- NATIVE BOTTOM NAVIGATION TAB BAR (7 Dedicated Tabs) -->
        <nav id="bottom-tab-bar" class="fixed bottom-0 left-0 right-0 max-w-[540px] mx-auto h-16 bg-white/95 backdrop-blur-md border-t border-slate-200 flex items-center justify-around px-1 z-40 shadow-2xl"></nav>

    </div>

    <!-- MODAL POPUPS CONTAINER -->
    <div id="modal-container" class="relative z-50"></div>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('RakshaCast PWA Worker registered:', reg.scope))
                    .catch(err => console.log('PWA Service Worker notice:', err));
            });
        }
    </script>

    <!-- Load Dedicated Mobile App Script -->
    <script src="/static/mobile-app.js"></script>

    <!-- Real-Time WebSocket Connection to NDRF Command Center -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            if (typeof initMobileApp === "function") {
                initMobileApp();
            }

            // Establish real-time WebSocket connection to NDRF backend
            const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${proto}//${window.location.host}/ws`;
            let ws;

            function connectWS() {
                ws = new WebSocket(wsUrl);
                ws.onopen = () => console.log("🟢 Connected to NDRF Real-Time Network");
                ws.onmessage = (evt) => {
                    try {
                        const msg = JSON.parse(evt.data);
                        if (msg.type === "OPERATOR_DISPATCH_BROADCAST") {
                            const banner = document.getElementById("citizen-dispatch-status-banner");
                            const eta = document.getElementById("citizen-dispatch-eta");
                            const txt = document.getElementById("citizen-dispatch-msg");
                            if (banner) {
                                banner.classList.remove("hidden");
                                if (eta) eta.innerText = `ETA: ${msg.eta_mins || 8} MINS`;
                                if (txt) txt.innerText = `NDRF Battalion dispatched to ${msg.zone_name || 'your sector'}. Rescue team is en route.`;
                                if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 500]);
                            }
                        }
                    } catch (e) {
                        console.error("WS message error:", e);
                    }
                };
                ws.onclose = () => {
                    setTimeout(connectWS, 3000);
                };
            }
            connectWS();
        });
    </script>
</body>
</html>
